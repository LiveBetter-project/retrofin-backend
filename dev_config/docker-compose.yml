networks:
  livebetter-net:
    driver: bridge

services:
  s342_backend:
    hostname: s342_backend
    container_name: s342_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    build: ../
    networks:
      - livebetter-net
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../:/usr/src/backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: s342_db
    volumes:
      - postgr_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=s342_db
    networks:
      - livebetter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d s342_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgr_data:
